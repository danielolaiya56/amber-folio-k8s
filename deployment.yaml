apiVersion: apps/v1
kind: Deployment
metadata:
  name: amber-folio
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: amber-folio
  template:
    metadata:
      labels:
        app: amber-folio
    spec:
      containers:
      - name: amber-folio
        image: danielolaiya56/amber-folio:77e97578edd4572ce5f907b92df2637b742100cf
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: amber-folio-svc
  namespace: default
spec:
  selector:
    app: amber-folio
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
