name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/amber-folio:${{ github.sha }}

    - name: Update deployment image tag
      run: |
        sed -i "s|image:.*amber-folio.*|image: ${{ secrets.DOCKER_USERNAME }}/amber-folio:${{ github.sha }}|g" deployment.yaml
        sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" deployment.yaml

    - name: Commit and push updated deployment
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add deployment.yaml
        git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes"
        git push